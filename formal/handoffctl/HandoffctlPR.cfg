\* Compatibility bootstrap for vendor snapshots created before AR-0101.
\* It is not a formal tier and exists only so an old vendor can install the
\* new vendor tool, which removes this file on its next atomic sync.
CONSTANTS
    Processes = {"p1"}
    Tasks = {"t1", "t2"}
    Actors = {a1}
    NoProcess = NoProcess
    NoActor = NoActor
    NoTask = "NoTask"
    MaxRevision = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OwnershipCoherence
    BlockedProvenance
    HierarchyCoherent
    UniqueActiveOwner
    LockSafety
    RevisionAccounting
    ProjectionAtomicity
    WorktreeBindingIsMonotonic
    AcceptedWorktreeBindIsBound
    PartialWorktreeKeyIsPreserved
    UniqueActiveWorktreeIdentity

PROPERTIES
    EventualCompletion
