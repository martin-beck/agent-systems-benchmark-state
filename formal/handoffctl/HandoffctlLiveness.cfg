CONSTANTS
    \* Deliberately reduced release-tier liveness abstraction.  The omitted
    \* concurrency and retry dimensions are mapped in LIVENESS_COVERAGE.json.
    Processes = {"p1"}
    Tasks = {"t1", "t2"}
    Actors = {a1}
    NoProcess = NoProcess
    NoActor = NoActor
    NoTask = "NoTask"
    MaxRevision = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OwnershipCoherence
    BlockedProvenance
    HierarchyCoherent
    UniqueActiveOwner
    LockSafety
    RevisionAccounting
    ProjectionAtomicity
    SpecBindingIsMonotonic
    AcceptedSpecBindIsBound
    WorktreeBindingIsMonotonic
    AcceptedWorktreeBindIsBound
    PartialWorktreeKeyIsPreserved
    UniqueActiveWorktreeIdentity

PROPERTIES
    EventualCompletion
