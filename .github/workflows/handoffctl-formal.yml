name: handoffctl formal verification

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/handoffctl"
      - "tools/handoffctl.py"
      - "tools/sqlite_storage.py"
      - "tools/status_renderer.py"
      - "tests/test_status_renderer.py"
      - "tests/test_handoffctl.py"
      - "tests/test_handoffctl_vendor.py"
      - "tests/test_sqlite_storage.py"
      - "formal/handoffctl/**"
      - "tools/tlc_runner.py"
      - "tools/run_formal_tier.py"
      - "tools/guest_seed.py"
      - "tests/test_tlc_runner.py"
      - "tests/test_formal_launcher.py"
      - ".github/workflows/handoffctl-formal.yml"
  pull_request:
    paths:
      - "tools/handoffctl"
      - "tools/handoffctl.py"
      - "tools/sqlite_storage.py"
      - "tools/status_renderer.py"
      - "tests/test_status_renderer.py"
      - "tests/test_handoffctl.py"
      - "tests/test_handoffctl_vendor.py"
      - "tests/test_sqlite_storage.py"
      - "formal/handoffctl/**"
      - "tools/tlc_runner.py"
      - "tools/run_formal_tier.py"
      - "tools/guest_seed.py"
      - "tests/test_tlc_runner.py"
      - "tests/test_formal_launcher.py"
      - ".github/workflows/handoffctl-formal.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-handoffctl:
    name: Model and implementation contract
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, agent-systems-benchmark-state-ci]
    timeout-minutes: 720

    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked quality environment
        run: uv sync --locked --only-group quality

      - name: Verify the provisioned runner user bus
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runtime_dir="/run/user/${runner_uid}"
          bus_path="${runtime_dir}/bus"
          manager_state="unavailable"
          ready=0
          for _attempt in {1..30}; do
            if [[ -d "$runtime_dir" && -S "$bus_path" ]]; then
              manager_state="$({
                XDG_RUNTIME_DIR="$runtime_dir" \
                  DBUS_SESSION_BUS_ADDRESS="unix:path=$bus_path" \
                  systemctl --user is-system-running 2>/dev/null || true
              })"
              if [[ "$manager_state" == "running" || "$manager_state" == "degraded" ]] && \
                XDG_RUNTIME_DIR="$runtime_dir" \
                DBUS_SESSION_BUS_ADDRESS="unix:path=$bus_path" \
                systemctl --user show-environment >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            echo "::error::runner user manager/bus did not become ready (uid=${runner_uid}, state=${manager_state})"
            echo "::error::Expected a lingering user manager with a private session bus at /run/user/<uid>/bus."
            exit 1
          fi
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$bus_path"
          } >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_dir" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$bus_path" \
            systemctl --user show-environment >/dev/null

      - name: Admit the preloaded offline TLC artifact
        shell: bash
        run: |
          set -euo pipefail
          jar=/srv/data/projects/asb-state-tlc-data-f16d2cb41/tla2tools.jar
          digest=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          if [[ ! -f "$jar" || -L "$jar" ]]; then
            echo "::error::reviewed offline TLC artifact is missing or is a symlink: $jar"
            exit 1
          fi
          printf '%s  %s\n' "$digest" "$jar" | sha256sum --check --strict
          {
            echo "TLC_JAR_PATH=$jar"
            echo "TLC_JAR_SHA256=$digest"
          } >> "$GITHUB_ENV"

      - name: Check exhaustive concurrent-state model
        run: uv run python tools/run_formal_tier.py --tier full-exhaustive

      - name: Check implementation refinement and fault behavior
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
