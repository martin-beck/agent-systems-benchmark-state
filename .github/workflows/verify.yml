name: Coordination verification
"on":
  push:
    branches: [main]
    paths:
      - ".pre-commit-config.yaml"
      - ".handoffctl.json"
      - "coordinator.binding.json"
      - "coordinator.vendor.json"
      - "docs/agent-workflow-coordinator.md"
      - ".github/workflows/handoffctl-formal.yml"
      - ".github/workflows/source-headers.yml"
      - ".github/workflows/verify.yml"
      - "formal/handoffctl/**"
      - "pyproject.toml"
      - "schema/handoffctl-backend-config.schema.json"
      - "schema/handoffctl-project-binding.schema.json"
      - "schema/handoffctl-project-config.schema.json"
      - "schema/task-schema.json"
      - "tests/test_handoffctl.py"
      - "tests/test_handoffctl_vendor.py"
      - "tests/test_source_headers.py"
      - "tests/test_sqlite_storage.py"
      - "tests/validate_schema.py"
      - "tools/awq"
      - "tools/check_source_headers.py"
      - "tools/handoffctl"
      - "tools/handoffctl.py"
      - "tools/handoffctl_vendor.py"
      - "tools/sqlite_storage.py"
      - "tools/status_renderer.py"
      - "uv.lock"
      - "vendor/agent-workflow-coordinator/**"
  pull_request:
    paths:
      - ".pre-commit-config.yaml"
      - ".handoffctl.json"
      - "coordinator.binding.json"
      - "coordinator.vendor.json"
      - "docs/agent-workflow-coordinator.md"
      - ".github/workflows/handoffctl-formal.yml"
      - ".github/workflows/source-headers.yml"
      - ".github/workflows/verify.yml"
      - "formal/handoffctl/**"
      - "pyproject.toml"
      - "schema/handoffctl-backend-config.schema.json"
      - "schema/handoffctl-project-binding.schema.json"
      - "schema/handoffctl-project-config.schema.json"
      - "schema/task-schema.json"
      - "tests/test_handoffctl.py"
      - "tests/test_handoffctl_vendor.py"
      - "tests/test_source_headers.py"
      - "tests/test_sqlite_storage.py"
      - "tests/validate_schema.py"
      - "tools/awq"
      - "tools/check_source_headers.py"
      - "tools/handoffctl"
      - "tools/handoffctl.py"
      - "tools/handoffctl_vendor.py"
      - "tools/sqlite_storage.py"
      - "tools/status_renderer.py"
      - "uv.lock"
      - "vendor/agent-workflow-coordinator/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Strict state consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: false
      - name: Locked quality environment
        run: uv sync --locked --only-group quality
      - name: Verify pinned coordinator release
        run: uv run python tools/handoffctl_vendor.py verify --target .
      - name: Verify Huawei MIT source headers
        run: uv run python tools/check_source_headers.py
      - name: Formatting and typing
        run: |
          uv run ruff format --check tools tests
          uv run ruff check --no-fix tools tests
          uv run mypy tools tests
      - name: Coordinator complexity budget
        run: uv run lizard -l python --CCN 14 tools/handoffctl.py
      - name: Fault tests and coverage
        run: |
          uv run coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          uv run coverage report --fail-under=95
      - name: Schema and generated state
        run: |
          uv run python tests/validate_schema.py
          tools/handoffctl render-status --check
          git diff --exit-code
          test ! -e .runtime/config.json
          test -z "$(git ls-files 'private-archive/**')"
      - name: DCO certification
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          revision_range=HEAD
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            revision_range="$PR_BASE_SHA..$PR_HEAD_SHA"
          fi
          while IFS= read -r revision; do
            expected=$(git show -s --format='Signed-off-by: %an <%ae>' "$revision")
            git show -s --format=%B "$revision" | grep -Fx -- "$expected"
          done < <(git rev-list "$revision_range")
