name: Huawei MIT source headers

"on":
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.sh"
      - "**/*.tla"
      - "tools/handoffctl"
      - "tools/awq"
      - ".pre-commit-config.yaml"
      - ".github/workflows/source-headers.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.sh"
      - "**/*.tla"
      - "tools/handoffctl"
      - "tools/awq"
      - ".pre-commit-config.yaml"
      - ".github/workflows/source-headers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify all tracked source headers
        run: python3 tools/check_source_headers.py
      - name: Run checker regression tests
        run: python3 -m unittest discover -s tests -p 'test_source_headers.py'
